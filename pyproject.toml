[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-demo"
version = "0.1.0"
description = "Phase 0-1 foundation for an on-prem AI configuration advisor"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.5,<3",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.21,<5",
  "httpx>=0.27,<1",
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
  "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
include = [
  "adapters*",
  "lab1_finetune*",
  "lab2_rag_agent*",
  "lab3_workflow*",
  "shared*",
]

[tool.pytest.ini_options]
testpaths = [
  "shared/tests",
  "lab1_finetune/tests",
  "lab2_rag_agent/tests",
  "lab3_workflow/tests",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
