[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-demo"
version = "0.1.0"
description = "Phase 0-1 foundation for an on-prem AI configuration advisor"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = [
  "adapters*",
  "agent*",
  "api*",
  "lab1*",
  "services*",
  "shared*",
  "workflow*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
